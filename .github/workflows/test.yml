name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: SQLite and HCL on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: '0.9.6'
          node-version: '24'
      - uses: ariga/setup-atlas@v0
      - run: nub install --frozen-lockfile
      - run: nub run typecheck
      - run: nub run test
      - run: nub run build
      - run: npm pack --dry-run
        working-directory: dist/sqlite
      - run: npm pack --dry-run
        working-directory: dist/reylo
