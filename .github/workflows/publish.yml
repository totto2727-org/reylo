name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: '0.9.6'
          node-version: '24'
      - run: nub install --frozen-lockfile
        working-directory: site
      - run: nub run build
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: dist/postgres
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: dist/sqlite
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: dist/mysql
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: dist/duckdb
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: dist/reylo
